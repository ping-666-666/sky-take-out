sky:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: localhost
    port: 3306
    database: sky_take_out
    username: root
    password: 123456

  # 阿里云 OSS 的密钥不要写进仓库，用环境变量或本地 application-local.yml 注入
  alioss:
    access-key-id: ${SKY_ALIOSS_ACCESS_KEY_ID:}
    access-key-secret: ${SKY_ALIOSS_ACCESS_KEY_SECRET:}
    endpoint: oss-cn-beijing.aliyuncs.com
    bucket-name: ping--king-sky-take-out

# 可选：加载本地私密配置（已被 .gitignore 忽略，不会被提交）
spring:
  config:
    import: optional:classpath:application-local.yml
